<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gera Documents</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='12' height='14' rx='2' fill='%232f6fb3'/%3E%3Cpath d='M5 5h6M5 8h6M5 11h4' stroke='white' stroke-width='1.3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <h1>Gera Documents</h1>
      <span class="sub">Analisar Markdown para Word</span>
    </div>
    <form id="form-pasta" class="pasta" autocomplete="off">
      <label for="campo-pasta">Pasta</label>
      <input id="campo-pasta" list="pastas-recentes" placeholder="C:\docs ou \\servidor\docs" spellcheck="false">
      <datalist id="pastas-recentes"></datalist>
      <button type="button" id="btn-procurar">Procurar...</button>
      <label class="check"><input type="checkbox" id="chk-subpastas" checked> Subpastas</label>
      <button type="submit" id="btn-buscar" class="primario">Buscar .md</button>
    </form>
  </header>

  <main class="area">
    <section class="coluna-lista" aria-label="Arquivos encontrados">
      <div class="filtros">
        <div class="chips" role="radiogroup" aria-label="Filtrar por situação">
          <button type="button" role="radio" data-filtro="" aria-checked="true">Todos <span data-conta=""></span></button>
          <button type="button" role="radio" data-filtro="Corrigir" aria-checked="false">Corrigir <span data-conta="Corrigir"></span></button>
          <button type="button" role="radio" data-filtro="Revisar" aria-checked="false">Revisar <span data-conta="Revisar"></span></button>
          <button type="button" role="radio" data-filtro="OK" aria-checked="false">OK <span data-conta="OK"></span></button>
        </div>
        <input id="campo-busca" type="search" placeholder="Filtrar por nome" aria-label="Filtrar por nome">
        <label class="ordem">Ordenar
          <select id="sel-ordem">
            <option value="">como encontrado</option>
            <option value="nome">nome</option>
            <option value="erros">mais erros</option>
            <option value="avisos">mais avisos</option>
          </select>
        </label>
      </div>
      <div class="tabela-rolagem">
        <table id="lista" class="lista">
          <thead>
            <tr>
              <th class="c-sel"><input type="checkbox" id="chk-todos" aria-label="Selecionar todos os visíveis"></th>
              <th>Arquivo</th>
              <th class="c-num">Erros</th>
              <th class="c-num">Avisos</th>
              <th class="c-sit">Situação</th>
            </tr>
          </thead>
          <tbody tabindex="0" aria-label="Lista de arquivos; use as setas para navegar e Espaço para selecionar"></tbody>
        </table>
        <p id="lista-vazia" class="vazio">Escolha a pasta (local ou de rede) e clique em <b>Buscar .md</b>.</p>
      </div>
    </section>

    <section class="coluna-detalhes">
      <div id="detalhes" class="detalhes" aria-live="polite"></div>
      <section id="painel-ia" class="painel-ia" aria-label="Revisão de texto com IA"></section>
    </section>
  </main>

  <footer class="base">
    <div class="acoes">
      <button type="button" id="btn-corrigir" class="primario">Criar versão corrigida</button>
      <button type="button" id="btn-comparar" disabled>Comparar com a origem</button>
      <button type="button" id="btn-abrir">Abrir .md</button>
      <button type="button" id="btn-word">Gerar Word</button>
      <button type="button" id="btn-relatorio">Salvar relatório</button>
    </div>
    <div class="status">
      <progress id="barra" hidden></progress>
      <span id="status" role="status" aria-live="polite">Pronto.</span>
      <button type="button" id="btn-cancelar" hidden>Cancelar</button>
    </div>
  </footer>

  <dialog id="dlg-confirmar" class="dialogo">
    <form method="dialog">
      <h2 id="dlg-titulo">Confirmar</h2>
      <div id="dlg-corpo"></div>
      <menu>
        <button value="nao">Cancelar</button>
        <button value="sim" class="primario" id="dlg-sim">Confirmar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg-comparacao" class="dialogo largo" aria-labelledby="cmp-titulo">
    <div class="cmp-topo">
      <h2 id="cmp-titulo">Comparação</h2>
      <span class="cmp-legenda">
        <span class="tag t-inserido">incluído</span>
        <span class="tag t-removido">removido</span>
        <span class="tag t-alterado">alterado</span>
      </span>
      <button type="button" id="cmp-fechar">Fechar</button>
    </div>
    <div id="cmp-corpo" class="cmp-corpo"></div>
  </dialog>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
